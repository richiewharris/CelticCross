<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, choosing the setting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&amp;family=Spectral:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#12100e}
a{color:#dcbb80}a:hover{color:#efe6d2}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;border:1px solid #3d3328;font-size:12px;color:#efe6d2;background:#1c1814}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#12100e;color:#efe6d2;font-family:Spectral, Georgia, serif;display:flex;flex-direction:column">
  <header style="height:52px;flex-shrink:0;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #3d3328;background:#1c1814">
    <span style="font-family:'Uncial Antiqua', serif;font-size:17px;color:#dcbb80">Setting</span>
    <span style="font-size:12.5px;color:#a99c84;flex-grow:1">then Muster · Marshalling · Winnow · Duels</span>
  </header>
  <div style="padding:12px 16px 0;display:flex;flex-direction:column;gap:4px">
    <span style="font-size:12px;color:#a99c84;letter-spacing:.07em;text-transform:uppercase">Slúagh v Ulster · you play second</span>
    <p style="margin:0;font-size:15px;line-height:1.4">Choose where the duels are fought: neutral ground, or your home.</p>
  </div>

  <div role="radiogroup" aria-label="Where the duels are fought" style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
      <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="border-radius:14px;border:2px solid {{o.edge}};background:#17130f;color:#efe6d2;font-family:inherit;text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column">
        <span style="height:56px;box-sizing:border-box;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:{{o.band}}"><span style="font-family:'Uncial Antiqua', serif;font-size:20px">{{o.name}}</span><span style="font-size:12px;color:#d8e4dd">{{o.tag}}</span></span>
        <span style="padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;color:#efe6d2">{{o.rules}}</span>
          <span style="font-size:13px;line-height:1.4;color:{{o.mineC}}">You: {{o.mine}}</span>
          <span style="font-size:13px;line-height:1.4;color:{{o.theirsC}}">Them: {{o.theirs}}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <p style="margin:0 16px;font-size:12.5px;line-height:1.45;color:#a99c84">Both of you see the choice before the Muster. Every other deck has a home too; open the guide to see them all.</p>

  <div style="margin-top:auto;padding:12px 16px 16px;border-top:1px solid #3d3328;background:#1c1814">
    <button type="button" style="width:100%;height:48px;border-radius:10px;border:none;background:#dcbb80;color:#22180f;font-family:inherit;font-size:15.5px;font-weight:700">{{go}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 1 }; }
  renderVals() {
    const O = [
      { name: "The ford", tag: "neutral", band: "#1d3a42", rules: "Valour +3", mine: "no change", theirs: "no change", mineC: "#a99c84", theirsC: "#a99c84" },
      { name: "The western crossing", tag: "your home", band: "#26302b", rules: "Valour +3 · Spirit +1 · Heals −1", mine: "4 Spirit supports +1; no Heals to lose", theirs: "Láeg and the Brown Bull heal 1 less", mineC: "#8fc48a", theirsC: "#e8877b" },
    ];
    const pick = this.state.pick;
    return {
      opts: O.map((o, i) => ({ ...o, on: i === pick ? "true" : "false", edge: i === pick ? "#dcbb80" : "#3d3328", pick: () => this.setState({ pick: i }) })),
      go: `Fight at ${O[pick].name.replace(/^The /, "the ")}`,
    };
  }
}
</script>
</body>
</html>
